trigger:
  branches:
    include:
      - main
  paths:
    include:
      - .pipelines/dev/shared-services/build-publish-register-shared-service-bundle-sonatype-nexus-vm.yaml
      - ./templates/shared_services/sonatype-nexus-vm/**
pool:
  vmImage: ubuntu-latest

variables:
  - group: tre-core-variables-dev
  - group: tre-core-auth-secrets-dev
  - group: azure-environment

jobs:
  - template: /.pipelines/jobs/build-publish-register-shared-service-bundle.yaml
    parameters:
      SHARED_SERVICE_BUNDLE: "sonatype-nexus-vm"
      LOCK_ENV: "dev"
