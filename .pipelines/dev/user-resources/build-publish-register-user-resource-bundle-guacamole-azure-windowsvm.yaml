trigger:
  branches:
    include:
      - main
  paths:
    include:
      - .pipelines/dev/user-resources/build-publish-register-user-resource-bundle-guacamole-azure-windowsvm.yaml
      - ./templates/workspace_services/guacamole/user_resources/guacamole-azure-windowsvm/**

pool:
  vmImage: ubuntu-latest

variables:
  - group: tre-core-variables-dev
  - group: tre-core-auth-secrets-dev
  - group: azure-environment

jobs:
  - template: /.pipelines/jobs/build-publish-register-user-resource-bundle.yaml
    parameters:
      WORKSPACE_SERVICE: "guacamole"
      USER_RESOURCE_BUNDLE: "guacamole-azure-windowsvm"
      LOCK_ENV: "dev"
