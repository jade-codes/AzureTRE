trigger:
  branches:
    include:
      - main
  paths:
    include:
      - .pipelines/dev/build-airlock-processor-image.yaml
      - ./airlock_processor/**

variables:
  - group: tre-core-variables-dev
  - group: tre-core-auth-secrets-dev
  - group: azure-environment

pool:
  vmImage: ubuntu-latest

jobs:
  - template: /.pipelines/jobs/build-airlock-processor-image.yaml
    parameters:
      LOCK_ENV: "dev"
