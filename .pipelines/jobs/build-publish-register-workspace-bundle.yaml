parameters:
  - name: WORKSPACE_BUNDLE
    displayName: "Choose Workspace Bundle"
    type: string
    values:
      - base
      - unrestricted
      - airlock-import-review
  - name: LOCK_ENV
    displayName: "Lock environment name (e.g. dev) - required"
    type: string
    values:
      - dev
      - prod

jobs:
  - deployment: BuildPublishRegisterWorkspaceTemplate
    displayName: Build Publish and Register '${{parameters.WORKSPACE_BUNDLE}}' Workspace Bundle
    environment: ${{ parameters.LOCK_ENV }}
    strategy:
      runOnce:
        deploy:
          steps:
            - template: ../jobs/enable_mgmt_acr_access.yaml
              parameters:
                SERVICE_CONNECTION_NAME: $(SERVICE_CONNECTION_NAME)
                ACR_NAME: $(ACR_NAME)

            - template: ../jobs/build_devcontainer.yaml
              parameters:
                SERVICE_CONNECTION_NAME: "$(SERVICE_CONNECTION_NAME)"
                ACR_NAME: $(ACR_NAME)

            - template: ../jobs/run_command_using_devcontainer.yaml
              parameters:
                SERVICE_CONNECTION_NAME: $(SERVICE_CONNECTION_NAME)
                DISPLAYNAME: "Build, Publish and Reigster '${{parameters.WORKSPACE_BUNDLE}}' Workspace Bundle"
                COMMAND: make workspace_bundle BUNDLE=${{parameters.WORKSPACE_BUNDLE}}

  - job: Cleanup
    dependsOn: BuildPublishRegisterWorkspaceTemplate
    condition: always()
    variables:
      AGENT_IP: $[ dependencies.BuildPublishRegisterWorkspaceTemplate.outputs['BuildPublishRegisterWorkspaceTemplate.addAgentIp.AGENT_IP'] ]
    steps:
      - template: ../jobs/disable_mgmt_acr_access.yaml
        parameters:
          SERVICE_CONNECTION_NAME: $(SERVICE_CONNECTION_NAME)
          ACR_NAME: $(ACR_NAME)
          CLIENT_IP_ADRESS: $(AGENT_IP)
