parameters:
  - name: SERVICE_CONNECTION_NAME
    type: string
  - name: ACR_NAME

steps:
  - task: AzureCLI@2
    name: addAgentIp
    displayName: "Add Agent IP To ACR Firewall"
    inputs:
      azureSubscription: ${{parameters.SERVICE_CONNECTION_NAME}}
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true # This flag is required to set the idToken environment variable.
      useGlobalConfig: true
      failOnStandardError: true
      inlineScript: |
        AGENT_IP=$(curl -s http://ipinfo.io/json | jq -r .ip)
        echo "##vso[task.setvariable variable=AGENT_IP;isOutput=true]$AGENT_IP"

        az acr update --name ${{ parameters.ACR_NAME }} --default-action Deny --public-network-enabled
        az acr network-rule add --name ${{ parameters.ACR_NAME }} --ip-address $AGENT_IP
    env:
      ARM_USE_AZUREAD: true
