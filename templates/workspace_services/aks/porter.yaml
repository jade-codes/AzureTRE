---
schemaVersion: 1.0.0
name: tre-workspace-service-aks
version: 1.8.2
description: "An Azure Kubernetes workspace service"
dockerfile: Dockerfile.tmpl
registry: azuretre

credentials:
  - name: azure_tenant_id
    env: ARM_TENANT_ID
  - name: azure_subscription_id
    env: ARM_SUBSCRIPTION_ID
  - name: azure_client_id
    env: ARM_CLIENT_ID
  - name: azure_client_secret
    env: ARM_CLIENT_SECRET
parameters:
  - name: workspace_id
    type: string
  - name: tre_id
    type: string
  - name: mgmt_acr_name
    type: string
    env: mgmt_acr_name
    description: "The devops ACR name"
  - name: mgmt_resource_group_name
    type: string
    description: "Resource group containing the devops ACR"
    env: MGMT_RESOURCE_GROUP_NAME
  - name: node_count
    type: integer
    default: 3
    description: "The number of nodes in the AKS cluster"
  - name: node_vm_size
    type: string
    default: "Standard_DS2_v2"
    description: "The VM size for the AKS nodes"
  - name: workspace_owners_group_id
    type: string
    description: "The object ID of the Azure AD group that will be granted admin access to the AKS cluster"

  # the following are added automatically by the resource processor
  - name: id
    type: string
    description: "An Id for this installation"
    env: id
  - name: tfstate_resource_group_name
    type: string
    description: "Resource group containing the Terraform state storage account"
  - name: tfstate_storage_account_name
    type: string
    description: "The name of the Terraform state storage account"
  - name: tfstate_container_name
    env: tfstate_container_name
    type: string
    default: "tfstate"
    description: "The name of the Terraform state storage container"
  - name: arm_use_msi
    env: ARM_USE_MSI
    type: boolean
    default: false
  - name: arm_environment
    env: ARM_ENVIRONMENT
    type: string
    default: "public"
  - name: aad_authority_url
    type: string
    default: "https://login.microsoftonline.com"

mixins:
  - exec
  - terraform:
      clientVersion: 1.12.2

outputs:
  - name: aks_id
    type: string
    applyTo:
      - install
      - upgrade
  - name: aks_name
    type: string
    applyTo:
      - install
      - upgrade
  - name: aks_fqdn
    type: string
    applyTo:
      - install
      - upgrade
  - name: aks_node_resource_group
    type: string
    applyTo:
      - install
      - upgrade
  - name: aks_identity_principal_id
    type: string
    applyTo:
      - install
      - upgrade
  - name: workspace_address_space
    type: string
    applyTo:
      - install
      - upgrade
  - name: service_private_urls
    type: string
    applyTo:
      - install
      - upgrade

install:
  - terraform:
      description: "Deploy AKS workspace service"
      vars:
        workspace_id: ${ bundle.parameters.workspace_id }
        tre_id: ${ bundle.parameters.tre_id }
        id: ${ bundle.parameters.id }
        mgmt_acr_name: ${ bundle.parameters.mgmt_acr_name }
        mgmt_resource_group_name: ${ bundle.parameters.mgmt_resource_group_name }
        aad_authority_url: ${ bundle.parameters.aad_authority_url }
        arm_environment: ${ bundle.parameters.arm_environment }
        workspace_owners_group_id: ${ bundle.parameters.workspace_owners_group_id }
        node_count: ${ bundle.parameters.node_count }
        node_vm_size: ${ bundle.parameters.node_vm_size }
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: tre-workspace-service-aks-${ bundle.parameters.id }
      outputs:
        - name: aks_id
        - name: aks_name
        - name: aks_fqdn
        - name: aks_node_resource_group
        - name: aks_identity_principal_id
        - name: workspace_address_space
        - name: service_private_urls

upgrade:
  - terraform:
      description: "Deploy AKS workspace service"
      vars:
        workspace_id: ${ bundle.parameters.workspace_id }
        tre_id: ${ bundle.parameters.tre_id }
        id: ${ bundle.parameters.id }
        mgmt_acr_name: ${ bundle.parameters.mgmt_acr_name }
        mgmt_resource_group_name: ${ bundle.parameters.mgmt_resource_group_name }
        aad_authority_url: ${ bundle.parameters.aad_authority_url }
        arm_environment: ${ bundle.parameters.arm_environment }
        workspace_owners_group_id: ${ bundle.parameters.workspace_owners_group_id }
        node_count: ${ bundle.parameters.node_count }
        node_vm_size: ${ bundle.parameters.node_vm_size }
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: tre-workspace-service-aks-${ bundle.parameters.id }
      outputs:
        - name: aks_id
        - name: aks_name
        - name: aks_fqdn
        - name: aks_node_resource_group
        - name: aks_identity_principal_id
        - name: workspace_address_space
        - name: service_private_urls

uninstall:
  - terraform:
      description: "Tear down AKS workspace service"
      vars:
        workspace_id: ${ bundle.parameters.workspace_id }
        tre_id: ${ bundle.parameters.tre_id }
        id: ${ bundle.parameters.id }
        mgmt_acr_name: ${ bundle.parameters.mgmt_acr_name }
        mgmt_resource_group_name: ${ bundle.parameters.mgmt_resource_group_name }
        aad_authority_url: ${ bundle.parameters.aad_authority_url }
        arm_environment: ${ bundle.parameters.arm_environment }
        workspace_owners_group_id: ${ bundle.parameters.workspace_owners_group_id }
        node_count: ${ bundle.parameters.node_count }
        node_vm_size: ${ bundle.parameters.node_vm_size }
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: tre-workspace-service-aks-${ bundle.parameters.id }
