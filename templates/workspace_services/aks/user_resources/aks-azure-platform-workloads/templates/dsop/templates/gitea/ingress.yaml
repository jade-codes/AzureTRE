apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - host: gitea-{{ .Values.name }}.{{ .Values.dnsZone }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea
                port:
                  number: 3000
