apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - host: hello-world-{{ .Values.name }}.{{ .Values.dnsZone }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-world
                port:
                  number: 5678
