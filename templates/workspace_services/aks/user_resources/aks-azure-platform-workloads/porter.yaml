---
schemaVersion: 1.0.0
name: tre-service-aks-platform-workloads
version: 1.0.0
description: "Deploy platform workloads in AKS"
dockerfile: Dockerfile.tmpl
registry: azuretre

credentials:
  - name: azure_tenant_id
    env: ARM_TENANT_ID
  - name: azure_subscription_id
    env: ARM_SUBSCRIPTION_ID
  - name: azure_client_id
    env: ARM_CLIENT_ID
  - name: azure_client_secret
    env: ARM_CLIENT_SECRET

parameters:
  - name: workspace_id
    type: string
  - name: node_count
    type: integer
  - name: node_size
    type: string
  - name: workload_name
    type: string
  - name: workload_type
    type: string
  - name: workload_environment_type
    type: string
  - name: parent_service_id
    type: string
    env: PARENT_SERVICE_ID
  - name: tre_id
    type: string
  - name: mgmt_acr_name
    type: string
    env: mgmt_acr_name
    description: "The devops ACR name"
  - name: mgmt_resource_group_name
    type: string
    description: "Resource group containing the devops ACR"
    env: MGMT_RESOURCE_GROUP_NAME
  - name: node_autoscaling_enabled
    type: boolean
    default: false
  - name: node_autoscaling_min_count
    type: integer
    default: 1
  - name: node_autoscaling_max_count
    type: integer
    default: 5
  - name: azure_environment
    type: string
    default: "AzureCloud"
    description: "Used by Azure CLI to set the Azure environment"
  - name: initial_admin_password
    type: string
    description: "Initial admin password for applicable instances"
    sensitive: true
    env: INITIAL_ADMIN_PASSWORD

  # the following are added automatically by the resource processor
  - name: id
    type: string
    description: "An Id for this installation"
    env: id
  - name: tfstate_resource_group_name
    type: string
    description: "Resource group containing the Terraform state storage account"
  - name: tfstate_storage_account_name
    type: string
    description: "The name of the Terraform state storage account"
  - name: tfstate_container_name
    env: tfstate_container_name
    type: string
    description: "The name of the Terraform state storage container"
  - name: arm_use_msi
    env: ARM_USE_MSI
    type: boolean
    default: false
  - name: arm_environment
    env: ARM_ENVIRONMENT
    type: string
    default: "public"
  - name: aad_authority_url
    type: string
    default: "https://login.microsoftonline.com"

mixins:
  - exec
  - terraform
  - helm3
  - az:
      clientVersion: 2.67.0
outputs:
  - name: aks_private_dns_zone
    description: "AKS private DNS zone"
    type: string
    default: ""
    applyTo:
      - install
      - upgrade
  - name: aks_cluster_name
    description: "AKS cluster name"
    type: string
    default: ""
    applyTo:
      - install
      - upgrade
  - name: aks_resource_group_name
    description: "AKS resource group name"
    type: string
    default: ""
    applyTo:
      - install
      - upgrade
  - name: aks_node_agent_pool_label
    description: "AKS Node Agent Pool label"
    type: string
    default: ""
    applyTo:
      - install
      - upgrade
  - name: aks_subdomain_suffix
    description: "AKS Subdomain Suffix"
    type: string
    default: ""
    applyTo:
      - install
      - upgrade
  - name: workload_endpoints
    description: "Workload endpoints for accessing deployed applications"
    type: string
    default: ""
    applyTo:
      - install
      - upgrade

install:
  - terraform:
      description: "Deploy AKS prerequisites"
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: ${ bundle.parameters.id }
      vars:
        workspace_id: ${ bundle.parameters.workspace_id }
        workload_type: ${ bundle.parameters.workload_type }
        tre_id: ${ bundle.parameters.tre_id }
        tre_resource_id: ${ bundle.parameters.id }
        environment_type: ${ bundle.parameters.workload_environment_type }
        parent_service_id: ${ bundle.parameters.parent_service_id }
        node_count: ${ bundle.parameters.node_count }
        node_size: ${ bundle.parameters.node_size }
        node_autoscaling_enabled: ${ bundle.parameters.node_autoscaling_enabled }
        node_autoscaling_min_count: ${ bundle.parameters.node_autoscaling_min_count }
        node_autoscaling_max_count: ${ bundle.parameters.node_autoscaling_max_count }
      outputs:
        - name: aks_private_dns_zone
        - name: aks_cluster_name
        - name: aks_resource_group_name
        - name: aks_node_agent_pool_label
        - name: aks_subdomain_suffix
  - az:
      description: "Set Azure Cloud Environment"
      arguments:
        - cloud
        - set
      flags:
        name: ${ bundle.parameters.azure_environment }
  - az:
      description: "Login to Azure"
      arguments:
        - login
      flags:
        identity:
        username: ${ bundle.credentials.azure_client_id }
  - az:
      description: "Downloading Kubernetes credentials"
      suppress-output: true
      arguments:
        - "aks"
        - "get-credentials"
      flags:
        name: ${ bundle.outputs.aks_cluster_name }
        resource-group: ${ bundle.outputs.aks_resource_group_name }
  - exec:
      description: "Configure kubelogin to use Azure CLI token"
      command: kubelogin
      arguments:
        - "convert-kubeconfig"
        - "-l"
        - "azurecli"
  - exec:
      description: "Update values.yaml with AKS parameters"
      command: /bin/bash
      arguments:
            - -c
            - |
              # Set environment variables for substitution
              export AKS_AGENT_POOL=$(cat /cnab/app/outputs/aks_node_agent_pool_label)
              export AKS_SUBDOMAIN_SUFFIX=$(cat /cnab/app/outputs/aks_subdomain_suffix)
              export AKS_DNS_ZONE=$(cat /cnab/app/outputs/aks_private_dns_zone)
              export AKS_INITIAL_ADMIN_PASSWORD=${{ bundle.parameters.initial_admin_password }}

              envsubst < "./manifests/${{ bundle.parameters.workload_type }}/values-template.yaml" > "./manifests/${{ bundle.parameters.workload_type }}/values.yaml"
  - helm3:
      description: "Install AKS Azure platform resources"
      name: ${ bundle.outputs.aks_node_agent_pool_label }
      namespace: ${ bundle.parameters.workload_type }
      chart: "./manifests/${ bundle.parameters.workload_type }"
      resetValues: true
      reuseValues: false
      wait: true
  - exec:
      description: "Get workload endpoints"
      command: /bin/bash
      arguments:
        - -c
        - |
          # Get the service host for this deployment
          kubectl get ingress -n ${ bundle.parameters.workload_type } -o jsonpath='{.items[*].spec.rules[*].host}' | tr ' ' '\n' | jq -R . | jq -s . > /cnab/app/outputs/workload_endpoints
      outputs:
        - name: workload_endpoints
          path: /cnab/app/outputs/workload_endpoints

upgrade:
  - terraform:
      description: "Update AKS prerequisites"
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: ${ bundle.parameters.id }
      vars:
        workspace_id: ${ bundle.parameters.workspace_id }
        workload_type: ${ bundle.parameters.workload_type }
        tre_id: ${ bundle.parameters.tre_id }
        tre_resource_id: ${ bundle.parameters.id }
        environment_type: ${ bundle.parameters.workload_environment_type }
        parent_service_id: ${ bundle.parameters.parent_service_id }
        node_count: ${ bundle.parameters.node_count }
        node_size: ${ bundle.parameters.node_size }
        node_autoscaling_enabled: ${ bundle.parameters.node_autoscaling_enabled }
        node_autoscaling_min_count: ${ bundle.parameters.node_autoscaling_min_count }
        node_autoscaling_max_count: ${ bundle.parameters.node_autoscaling_max_count }
      outputs:
        - name: aks_private_dns_zone
        - name: aks_cluster_name
        - name: aks_resource_group_name
        - name: aks_node_agent_pool_label
        - name: aks_subdomain_suffix
  - az:
      description: "Set Azure Cloud Environment"
      arguments:
        - cloud
        - set
      flags:
        name: ${ bundle.parameters.azure_environment }
  - az:
      description: "Login to Azure"
      arguments:
        - login
      flags:
        identity:
        username: ${ bundle.credentials.azure_client_id }
  - az:
      description: "Downloading Kubernetes credentials"
      suppress-output: true
      arguments:
        - "aks"
        - "get-credentials"
      flags:
        name: ${ bundle.outputs.aks_cluster_name }
        resource-group: ${ bundle.outputs.aks_resource_group_name }
  - exec:
      description: "Configure kubelogin to use Azure CLI token"
      command: kubelogin
      arguments:
        - "convert-kubeconfig"
        - "-l"
        - "azurecli"
  - exec:
      description: "Update values.yaml with AKS parameters"
      command: /bin/bash
      arguments:
            - -c
            - |
              # Set environment variables for substitution
              export AKS_AGENT_POOL=$(cat /cnab/app/outputs/aks_node_agent_pool_label)
              export AKS_SUBDOMAIN_SUFFIX=$(cat /cnab/app/outputs/aks_subdomain_suffix)
              export AKS_DNS_ZONE=$(cat /cnab/app/outputs/aks_private_dns_zone)
              export AKS_INITIAL_ADMIN_PASSWORD=${{ bundle.parameters.initial_admin_password }}

              envsubst < "./manifests/${{ bundle.parameters.workload_type }}/values-template.yaml" > "./manifests/${{ bundle.parameters.workload_type }}/values.yaml"
  - helm3:
      description: "Upgrade AKS Azure platform resources"
      name: ${ bundle.outputs.aks_node_agent_pool_label }
      namespace: ${ bundle.parameters.workload_type }
      chart: "./manifests/${ bundle.parameters.workload_type }"
      resetValues: true
      reuseValues: false
      wait: true
  - exec:
      description: "Get workload endpoints"
      command: /bin/bash
      arguments:
        - -c
        - |
          # Get the service host for this deployment
          kubectl get ingress -n ${ bundle.parameters.workload_type } -o jsonpath='{.items[*].spec.rules[*].host}' | tr ' ' '\n' | jq -R . | jq -s . > /cnab/app/outputs/workload_endpoints
      outputs:
        - name: workload_endpoints
          path: /cnab/app/outputs/workload_endpoints

uninstall:
  - az:
      description: "Set Azure Cloud Environment"
      arguments:
        - cloud
        - set
      flags:
        name: ${ bundle.parameters.azure_environment }
  - az:
      description: "Login to Azure"
      arguments:
        - login
      flags:
        identity:
        username: ${ bundle.credentials.azure_client_id }
  - az:
      description: "Downloading Kubernetes credentials"
      suppress-output: true
      arguments:
        - "aks"
        - "get-credentials"
      flags:
        name: ${ bundle.outputs.aks_cluster_name }
        resource-group: ${ bundle.outputs.aks_resource_group_name }
  - exec:
      description: "Configure kubelogin to use Azure CLI token"
      command: kubelogin
      arguments:
        - "convert-kubeconfig"
        - "-l"
        - "azurecli"
  - helm3:
      description: "Uninstall AKS Azure platform resources"
      namespace: ${ bundle.parameters.workload_type }
      releases:
        - ${ bundle.outputs.aks_node_agent_pool_label }
      wait: true
  - terraform:
      description: "Tear down AKS prerequisites"
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: ${ bundle.parameters.id }
      vars:
        workspace_id: ${ bundle.parameters.workspace_id }
        workload_type: ${ bundle.parameters.workload_type }
        tre_id: ${ bundle.parameters.tre_id }
        tre_resource_id: ${ bundle.parameters.id }
        environment_type: ${ bundle.parameters.workload_environment_type }
        parent_service_id: ${ bundle.parameters.parent_service_id }
        node_count: ${ bundle.parameters.node_count }
        node_size: ${ bundle.parameters.node_size }
        node_autoscaling_enabled: ${ bundle.parameters.node_autoscaling_enabled }
        node_autoscaling_min_count: ${ bundle.parameters.node_autoscaling_min_count }
        node_autoscaling_max_count: ${ bundle.parameters.node_autoscaling_max_count }
