apiVersion: v2
name: workload-dsop
version: "1.0.6"
description: Helm chart for AKS workspace service with DevSecOps tools (Gitea, Jenkins, Nexus)
appVersion: "1.0.0"

dependencies:
  - name: jenkins
    version: "5.8.79"
    repository: "https://charts.jenkins.io"
    condition: jenkins.enabled
  - name: nexus-repository-manager
    version: "64.2.0"
    repository: "https://sonatype.github.io/helm3-charts"
    condition: nexus-repository-manager.enabled
  - name: gitea
    version: "12.2.0"
    repository: "https://dl.gitea.io/charts"
    condition: gitea.enabled
