# AKS CPU override (no GPU) using the CPU image
vllm-cpu:
  service:
    type: ClusterIP
    port: 8000

  # Ingress
  ingress:
    enabled: true
    className: "webapprouting.kubernetes.azure.com"
    hosts:
      - host: "qwen-${AKS_SUBDOMAIN_SUFFIX}.${AKS_DNS_ZONE}"
        paths:
          - path: /
            pathType: "Prefix"

  # Use a small model by default for CPU
  model:
    mode: hub
    id: Qwen/Qwen3-Coder-30B-A3B-Instruct
    trustRemoteCode: true
    hfToken: ${AKS_HF_TOKEN}

  # vLLM tuning for small CPU footprint
  vllm:
    dtype: auto
    kvCacheSpace: 100
    ompThreadsBind: 16
    shmSize: "Gi"
    extraArgs: "--max-model-len 32768 --enable-auto-tool-choice --tool-call-parser qwen3_coder"

  # CPU resources suitable for small models; adjust for your cluster
  resources:
    requests:
      cpu: "16"
      memory: "180Gi"
    limits:
      cpu: "24"
      memory: "200Gi"

  # Prefer generic nodeSelector (template uses this). Uncomment and set agentpool to target an AKS pool.
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.azure.com/agentpool: ${AKS_AGENT_POOL}
    agentpool: ${AKS_AGENT_POOL}

  # No Azure blob storage by default for CPU/hub mode
  storage:
    enabled: false

  cache:
    enabled: true
    pvcName: "${AKS_AGENT_POOL}-hf-data"
    size: "100Gi"
    storageClassName: "managed-csi"
