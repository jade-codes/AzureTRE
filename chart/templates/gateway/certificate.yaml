{{- if .Values.certs.certmanager -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "tre.fullname" . }}
spec:
  secretName: {{ include "tre.fullname" . }}-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  subject:
    organizations:
      - 'Microsoft'
  commonName: 'TRE'
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 4096
    rotationPolicy: Always
  usages:
    - server auth
  dnsNames:
    - {{ .Values.gateway.hostname | quote }}
  issuerRef:
    name: {{ .Values.certs.issuer }}
    kind: {{ .Values.certs.issuerKind }}
{{- end }}
