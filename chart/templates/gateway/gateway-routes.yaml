{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "tre.fullname" . }}-api-route
spec:
  parentRefs:
  - name: {{ include "tre.fullname" . }}-gateway
    namespace: {{ include "tre.namespace" . }}
    kind: Gateway
    sectionName: tre-web
  hostnames:
  - {{ .Values.gateway.hostname | quote }}
  rules:
  - name: api-route
    matches:
    - path:
        value: "/api"
    backendRefs:
    - name: {{ include "tre.fullname" . }}-api
      namespace: {{ include "tre.namespace" . }}
      port: {{ .Values.service.port }}

  - name: ui-route
    matches:
    - path:
        value: "/"
    backendRefs:
    - name: {{ include "tre.fullname" . }}-ui
      namespace: {{ include "tre.namespace" . }}
      port: {{ .Values.service.port }}
{{- end }}
